  filter:
    min_words: 3                        # fewer letter-words (after removing links/@/#) -> very_short
    languages: [pl, en, de, ru, uk]     # candidate languages for lingua
    min_pl_confidence: 0.5              # below -> non_polish
    drop_duplicates: true               # same normalised text within an event file -> duplicate

