bluesky:
  days_before: 7
  days_after: 14
  material_max_age: 4

wykop:
  days_before: 7
  days_after: 14
  material_max_age: 4

youtube:
  days_before: 7
  days_after: 14
  material_max_age: 4

preprocess:
  # Event folders (data/raw/<platform>/<event>) to run filter_* / clean_* for.
  events:
    - 2022-02-24_Atak_Rosji_Ukraina
    - 2022-05-08_Zabojstwo_Nowy_Swiat
    - 2023-09-22_Premiera_Zielona_Granica
    - 2023-10-15_Referendum_Wybory
    - 2024-04-10_Pakt_Azyl_PE
    - 2024-05-28_Atak_Zolnierz_Granica
    - 2024-06-06_Smierc_Zolnierza
    - 2024-09-08_Bojka_Srem
    - 2024-10-12_Strategia_Migracyjna
    - 2025-06-06_Naloty_ICE_Los_Angeles
    - 2025-10-15_Dezinformacja_Krakow
    - 2026-06-12_Pakt_Migracyjny_Wejscie_w_Zycie
    - 2026-07-30_Ceuta_Masowe_Przekroczenie
    - 2026-08-15_Atak_Kamienna_Gora
    - 2026-09-15_Atak_Jaroslaw
    - 2026-09-15_Raport_SG_Statystyki_Deportacje
    - 2024-12-20_Atak_Jarmark_Magdeburg
    - 2025-03-30_Dezinformacja_Wroclaw_Relokacja_Migrantow
    - 2025-07-19_Protesty_Antyimigracyjne_Polska
    - 2025-07-31_Dezinformacja_Swinoujscie_Autokar_Migranci
    - 2026-07-11_Atak_Ukrainskie_Nastolatki_Bielsko_Biala

  filter:
    min_words: 3                        # fewer letter-words (after removing links/@/#) -> very_short
    languages: [pl, en, de, ru, uk]     # candidate languages for lingua
    min_pl_confidence: 0.5              # below -> non_polish
    drop_duplicates: true               # same normalised text within an event file -> duplicate

llm:
  provider: gemini
  model: gemini-3.5-flash-lite
  batch_size: 50
  runs:
    bluesky-Atak_Zolnierz_Granica:      {platform: bluesky, event: 2024-05-28_Atak_Zolnierz_Granica, args: "--window -7:14"}
